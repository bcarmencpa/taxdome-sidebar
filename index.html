<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaxDome Lookup</title>
  <link rel="stylesheet" href="https://integrations.missiveapp.com/missive.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 12px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--missive-border-color, #e0e0e0);
    }
    .header svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .header h2 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }
    .contact-info {
      margin-bottom: 16px;
    }
    .contact-info .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.6;
      margin-bottom: 2px;
    }
    .contact-info .value {
      font-size: 14px;
      font-weight: 500;
      word-break: break-all;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #4f46e5;
      color: #fff;
    }
    .btn-secondary {
      background: transparent;
      color: var(--missive-text-color, #333);
      border: 1px solid var(--missive-border-color, #ddd);
    }
    .status-msg {
      text-align: center;
      padding: 32px 12px;
      font-size: 13px;
      opacity: 0.6;
    }
    .status-msg svg {
      width: 32px;
      height: 32px;
      margin: 0 auto 12px;
      opacity: 0.4;
    }
    .firm-badge {
      font-size: 10px;
      opacity: 0.4;
      text-align: center;
      margin-top: 24px;
      padding-top: 12px;
      border-top: 1px solid var(--missive-border-color, #e0e0e0);
    }
  </style>
</head>
<body>

  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <h2>TaxDome Lookup</h2>
  </div>

  <div id="content">
    <div class="status-msg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      <p>Select a conversation to look up the client in TaxDome.</p>
    </div>
  </div>

  <div class="firm-badge">Carmen Pearl Goodman Goldsmith CPAs</div>

  <script>
    // Your TaxDome portal URL - update this to your actual subdomain
    const TAXDOME_PORTAL = 'https://carmen-pearl-cpa.taxdome.com/';

    function renderContact(email, name) {
      const searchUrl = TAXDOME_PORTAL + '/contacts?search=' + encodeURIComponent(email);
      const accountsUrl = TAXDOME_PORTAL + '/accounts?search=' + encodeURIComponent(email);

      document.getElementById('content').innerHTML = `
        <div class="contact-info">
          <div class="label">Sender</div>
          <div class="value">${escapeHtml(name || 'Unknown')}</div>
        </div>
        <div class="contact-info">
          <div class="label">Email</div>
          <div class="value">${escapeHtml(email)}</div>
        </div>
        <button class="btn btn-primary" onclick="openTaxDome('${escapeAttr(searchUrl)}')">
          Open in TaxDome
        </button>
        <button class="btn btn-secondary" onclick="openTaxDome('${escapeAttr(accountsUrl)}')">
          Search Accounts
        </button>
      `;
    }

    function renderEmpty() {
      document.getElementById('content').innerHTML = `
        <div class="status-msg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <p>No email address found for this conversation.</p>
        </div>
      `;
    }

    function renderMultiple() {
      document.getElementById('content').innerHTML = `
        <div class="status-msg">
          <p>Select a single conversation to look up.</p>
        </div>
      `;
    }

    function openTaxDome(url) {
      if (window.Missive) {
        Missive.openURL(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function handleConversationChange(ids) {
      if (!ids || ids.length === 0) return;
      if (ids.length > 1) {
        renderMultiple();
        return;
      }

      Missive.fetchConversations(ids, ['latest_message', 'messages_count'])
        .then(function(conversations) {
          if (!conversations || conversations.length === 0) {
            renderEmpty();
            return;
          }

          const convo = conversations[0];
          let email = null;
          let name = null;

          // Try to get the from address of the latest message
          if (convo.latest_message) {
            const msg = convo.latest_message;
            if (msg.from_field && msg.from_field.address) {
              email = msg.from_field.address;
              name = msg.from_field.name || null;
            }
          }

          // Fallback: check conversation assignees or subject
          if (!email && convo.email_conversations) {
            const ec = convo.email_conversations[0];
            if (ec && ec.latest_from) {
              email = ec.latest_from.address;
              name = ec.latest_from.name || null;
            }
          }

          if (email) {
            // Filter out your own firm emails
            const firmDomains = ['carmenpearl.com', 'carmenpgs.com'];
            const domain = email.split('@')[1];
            if (firmDomains.includes(domain)) {
              // Try to find the client email from "to" field instead
              if (convo.latest_message && convo.latest_message.to_fields) {
                for (const to of convo.latest_message.to_fields) {
                  const toDomain = to.address.split('@')[1];
                  if (!firmDomains.includes(toDomain)) {
                    email = to.address;
                    name = to.name || null;
                    break;
                  }
                }
              }
            }
            renderContact(email, name);
          } else {
            renderEmpty();
          }
        })
        .catch(function(err) {
          console.error('Missive fetch error:', err);
          renderEmpty();
        });
    }

    // Listen for conversation changes in Missive
    if (window.Missive) {
      Missive.on('change:conversations', function(ids) {
        handleConversationChange(ids);
      });
    }

    // For testing outside Missive - show a demo state
    if (!window.Missive) {
      document.getElementById('content').innerHTML = `
        <div class="status-msg">
          <p><strong>Demo Mode</strong></p>
          <p style="margin-top:8px">This app runs inside Missive's sidebar. Install it via:<br><br>
          Settings > Integrations > Custom > Add iFrame integration</p>
        </div>
      `;
    }
  </script>
</body>
</html>
