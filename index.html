<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaxDome Lookup</title>
  <script src="https://integrations.missiveapp.com/missive.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 12px;
      margin: 0;
      font-size: 13px;
      color: #e0e0e0;
      background: transparent;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header svg { width: 20px; height: 20px; flex-shrink: 0; }
    .header h2 { font-size: 14px; font-weight: 600; margin: 0; }
    .contact-info { margin-bottom: 12px; }
    .contact-info .label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
      opacity: 0.5; margin-bottom: 2px;
    }
    .contact-info .value { font-size: 14px; font-weight: 500; word-break: break-all; }
    .btn {
      display: block; width: 100%; padding: 10px 16px; font-size: 13px;
      font-weight: 600; text-align: center; text-decoration: none;
      border-radius: 6px; border: none; cursor: pointer; margin-bottom: 8px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-secondary {
      background: transparent; color: #e0e0e0;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .status-msg {
      text-align: center; padding: 32px 12px; font-size: 13px; opacity: 0.6;
    }
    .status-msg svg { width: 32px; height: 32px; margin: 0 auto 12px; opacity: 0.4; display: block; }
    .firm-badge {
      font-size: 10px; opacity: 0.3; text-align: center; margin-top: 24px;
      padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1);
    }
    #debug { font-size: 10px; opacity: 0.4; margin-top: 16px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
    <h2>TaxDome Lookup</h2>
  </div>

  <div id="content">
    <div class="status-msg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      <p>Select a conversation to look up the client in TaxDome.</p>
    </div>
  </div>

  <div class="firm-badge">Carmen Pearl Goodman Goldsmith CPAs</div>
  <div id="debug"></div>

  <script>
    var TAXDOME_PORTAL = 'https://carmen-pearl-cpa.taxdome.com';
    var FIRM_DOMAINS = ['carmenpearl.com', 'carmenpgs.com'];
    var debugEl = document.getElementById('debug');

    function log(msg) {
      debugEl.textContent += msg + ' | ';
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderContact(email, name) {
      var searchUrl = TAXDOME_PORTAL + '/app/clients?search=' + encodeURIComponent(email);
      var accountsUrl = TAXDOME_PORTAL + '/app/clients?search=' + encodeURIComponent(email);

      document.getElementById('content').innerHTML =
        '<div class="contact-info">' +
          '<div class="label">Sender</div>' +
          '<div class="value">' + escapeHtml(name || 'Unknown') + '</div>' +
        '</div>' +
        '<div class="contact-info">' +
          '<div class="label">Email</div>' +
          '<div class="value">' + escapeHtml(email) + '</div>' +
        '</div>' +
        '<a class="btn btn-primary" href="' + searchUrl + '" target="_blank" rel="noopener">Open in TaxDome</a>' +
        '<a class="btn btn-secondary" href="' + accountsUrl + '" target="_blank" rel="noopener">Search Accounts</a>';
    }

    function renderEmpty(reason) {
      document.getElementById('content').innerHTML =
        '<div class="status-msg"><p>' + (reason || 'No email found for this conversation.') + '</p></div>';
    }

    log('Starting');

    // Check if Missive SDK loaded
    if (typeof Missive !== 'undefined') {
      log('Missive SDK found');

      Missive.on('change:conversations', function(ids) {
        log('Conversations changed: ' + JSON.stringify(ids));

        if (!ids || ids.length === 0) {
          renderEmpty('Select a conversation.');
          return;
        }

        Missive.fetchConversations(ids, ['latest_message', 'assignees'])
          .then(function(conversations) {
            log('Fetched ' + conversations.length + ' convos');

            if (!conversations || conversations.length === 0) {
              renderEmpty();
              return;
            }

            var convo = conversations[0];
            log('Convo keys: ' + Object.keys(convo).join(','));

            var email = null;
            var name = null;

            if (convo.latest_message) {
              var msg = convo.latest_message;
              log('Msg keys: ' + Object.keys(msg).join(','));

              if (msg.from_field) {
                email = msg.from_field.address;
                name = msg.from_field.name;
                log('From: ' + email);
              }
            }

            if (email) {
              var domain = email.split('@')[1];
              if (FIRM_DOMAINS.indexOf(domain) !== -1) {
                log('Firm email, checking To');
                if (convo.latest_message && convo.latest_message.to_fields) {
                  for (var i = 0; i < convo.latest_message.to_fields.length; i++) {
                    var to = convo.latest_message.to_fields[i];
                    var toDomain = to.address.split('@')[1];
                    if (FIRM_DOMAINS.indexOf(toDomain) === -1) {
                      email = to.address;
                      name = to.name;
                      log('Using To: ' + email);
                      break;
                    }
                  }
                }
              }
              renderContact(email, name);
            } else {
              renderEmpty('No email address found.');
            }
          })
          .catch(function(err) {
            log('Error: ' + err.message);
            renderEmpty('Error loading conversation.');
          });
      });
    } else {
      log('No Missive SDK');
      document.getElementById('content').innerHTML =
        '<div class="status-msg">' +
          '<p><strong>Waiting for Missive SDK...</strong></p>' +
          '<p style="margin-top:8px;font-size:11px;">If this persists, make sure this is added via Settings > Integrations > Custom iFrame.</p>' +
        '</div>';
    }
  </script>
</body>
</html>
